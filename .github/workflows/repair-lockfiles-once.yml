name: One-time lockfile repair

on:
  push:
    branches:
      - fix/production-stabilization
    paths:
      - .github/workflows/repair-lockfiles-once.yml

permissions:
  contents: write

jobs:
  repair-lockfiles:
    if: github.ref == 'refs/heads/fix/production-stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile backend lockfile and apply non-breaking security updates
        working-directory: backend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo 'Some advisories require manual or breaking-version decisions; keep safe lockfile updates and continue.'
      - name: Reconcile frontend lockfile and apply non-breaking security updates
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile updates to the stabilization branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "chore: reconcile lockfiles and apply safe dependency fixes"
            git push origin HEAD:fix/production-stabilization
          fi
