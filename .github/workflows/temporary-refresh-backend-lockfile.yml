name: Temporary backend lockfile refresh

on:
  push:
    branches:
      - fix/production-stabilization
    paths:
      - .github/workflows/temporary-refresh-backend-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/fix/production-stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-stabilization
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without running package scripts
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: synchronize backend dependency lockfile"
          git push origin HEAD:fix/production-stabilization
