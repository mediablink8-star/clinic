name: Repair backend lockfile (temporary)

on:
  push:
    branches: [fix/production-stabilization]

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-stabilization
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate backend lockfile from package.json
        run: cd backend && rm package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile if changed
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: regenerate backend package lockfile"
          git push origin HEAD:fix/production-stabilization
